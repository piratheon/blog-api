[project]
name = "fieldnotes-api"
version = "0.1.0"
description = "Read counts, votes and anonymous comments for the Field Notes blog"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.0",
  "sqlalchemy>=2.0",
  # Required as soon as a Postgres URL is detected, which is the normal case on
  # Vercel. Without it SQLAlchemy raises ModuleNotFoundError at import time.
  "psycopg[binary]>=3.2",
]

[project.scripts]
fieldnotes-api = "fieldnotes.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fieldnotes"]

[tool.pytest.ini_options]
testpaths = ["tests"]